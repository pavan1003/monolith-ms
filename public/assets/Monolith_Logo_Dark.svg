<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C49A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E5B5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="markBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141824;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0C10;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ── LOGO MARK (large, centred vertically) ── -->
  <g transform="translate(40, 44)">

    <!-- Outer rounded square background -->
    <rect x="0" y="0" width="272" height="272" rx="28" fill="url(#markBg)" />

    <!-- Inner border ring -->
    <rect x="8" y="8" width="256" height="256" rx="22"
          fill="none" stroke="#2E3A4E" stroke-width="1.5" opacity="0.6"/>

    <!-- Subtle inner glow ring -->
    <rect x="16" y="16" width="240" height="240" rx="18"
          fill="none" stroke="#00C49A" stroke-width="0.6" opacity="0.12"/>

    <!-- ── Diamond shape ── -->
    <!-- Shadow/depth layer -->
    <polygon points="136,28 244,136 136,244 28,136"
             fill="none" stroke="#00C49A" stroke-width="1.2" opacity="0.18"/>

    <!-- Main diamond -->
    <polygon points="136,32 240,136 136,240 32,136"
             fill="none" stroke="url(#accentGrad)" stroke-width="3"
             stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Diamond inner fill (very subtle) -->
    <polygon points="136,32 240,136 136,240 32,136"
             fill="#00C49A" opacity="0.04"/>

    <!-- ── Centre square mark ── -->
    <rect x="110" y="110" width="52" height="52" rx="6"
          fill="url(#accentGrad)" opacity="0.96"/>
    <!-- Centre square inner detail -->
    <rect x="120" y="120" width="32" height="32" rx="3"
          fill="none" stroke="#0A0C10" stroke-width="2.5" opacity="0.4"/>
    <!-- Centre dot -->
    <circle cx="136" cy="136" r="5" fill="#0A0C10" opacity="0.5"/>

    <!-- ── Vertex nodes (diamond tips) ── -->
    <!-- Top -->
    <circle cx="136" cy="32" r="7" fill="#00C49A" opacity="0.7"/>
    <circle cx="136" cy="32" r="4" fill="#00C49A"/>
    <!-- Right -->
    <circle cx="240" cy="136" r="7" fill="#00C49A" opacity="0.7"/>
    <circle cx="240" cy="136" r="4" fill="#00C49A"/>
    <!-- Bottom -->
    <circle cx="136" cy="240" r="7" fill="#00C49A" opacity="0.7"/>
    <circle cx="136" cy="240" r="4" fill="#00C49A"/>
    <!-- Left -->
    <circle cx="32"  cy="136" r="7" fill="#00C49A" opacity="0.7"/>
    <circle cx="32"  cy="136" r="4" fill="#00C49A"/>

    <!-- ── Connection stubs (circuit traces extending outward) ── -->
    <!-- Top stub -->
    <line x1="136" y1="32" x2="136" y2="8" stroke="#00C49A" stroke-width="2" opacity="0.4"/>
    <circle cx="136" cy="8" r="2.5" fill="#00C49A" opacity="0.3"/>
    <!-- Right stub -->
    <line x1="240" y1="136" x2="264" y2="136" stroke="#00C49A" stroke-width="2" opacity="0.4"/>
    <circle cx="264" cy="136" r="2.5" fill="#00C49A" opacity="0.3"/>
    <!-- Bottom stub -->
    <line x1="136" y1="240" x2="136" y2="264" stroke="#00C49A" stroke-width="2" opacity="0.4"/>
    <circle cx="136" cy="264" r="2.5" fill="#00C49A" opacity="0.3"/>
    <!-- Left stub -->
    <line x1="32" y1="136" x2="8" y2="136" stroke="#00C49A" stroke-width="2" opacity="0.4"/>
    <circle cx="8" cy="136" r="2.5" fill="#00C49A" opacity="0.3"/>

    <!-- ── Mid-point circuit dots on diamond edges ── -->
    <circle cx="188" cy="84"  r="3" fill="#00C49A" opacity="0.35"/>
    <circle cx="188" cy="188" r="3" fill="#00C49A" opacity="0.35"/>
    <circle cx="84"  cy="84"  r="3" fill="#00C49A" opacity="0.35"/>
    <circle cx="84"  cy="188" r="3" fill="#00C49A" opacity="0.35"/>

    <!-- ── Corner micro dots (PCB via style) ── -->
    <circle cx="46" cy="46"   r="2.5" fill="#2E3A4E"/>
    <circle cx="226" cy="46"  r="2.5" fill="#2E3A4E"/>
    <circle cx="46" cy="226"  r="2.5" fill="#2E3A4E"/>
    <circle cx="226" cy="226" r="2.5" fill="#2E3A4E"/>
  </g>

  <!-- ── WORDMARK ── -->
  <g transform="translate(356, 68)">

    <!-- Company name: Serif, large -->
    <text x="0" y="130"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="120"
          font-weight="400"
          letter-spacing="-1"
          fill="#FFFFFF">Monolith</text>

    <!-- Sub-name: Monospace, spaced -->
    <text x="6" y="184"
          font-family="'Courier New', Courier, monospace"
          font-size="38"
          font-weight="600"
          letter-spacing="18"
          fill="#00C49A">MICROSYSTEMS</text>

    <!-- Rule line -->
    <line x1="4" y1="206" x2="822" y2="206"
          stroke="#2E3A4E" stroke-width="1.5"/>

    <!-- Tagline -->
    <text x="6" y="240"
          font-family="'Courier New', Courier, monospace"
          font-size="26"
          letter-spacing="10"
          fill="#8A96A8">EMBEDDED SYSTEMS ENGINEERING</text>

    <!-- Domain micro-labels -->
    <text x="6" y="278"
          font-family="'Courier New', Courier, monospace"
          font-size="18"
          letter-spacing="3"
          fill="#2E3A4E">Industrial Automation  ·  Autonomous Systems  ·  Edge AI  ·  IIoT</text>
  </g>

  <!-- Accent dot top-right (brand element) -->
  <circle cx="1168" cy="32" r="8" fill="#00C49A" opacity="0.6"/>
  <circle cx="1168" cy="32" r="4" fill="#00C49A"/>
</svg>
